name: CD — Moderno Deploy

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/moderno

jobs:

  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      api_url:   ${{ steps.api_url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          TAG=${{ github.ref_name }}-${{ github.sha }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Resolve API URL for build
        id: api_url
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ secrets.STAGING_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-server:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-server:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-client:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-client:${{ github.ref_name }}-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     22
          script: |
            set -e

            mkdir -p ~/moderno-staging
            cd ~/moderno-staging

            # ── Write .env ───────────────────────
            cat > .env << 'ENVEOF'
            NODE_ENV=production
            POSTGRES_USER=${{ secrets.STAGING_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.STAGING_DB_NAME }}
            JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
            FRONTEND_URL=${{ secrets.STAGING_URL }}
            IMAGE_SERVER=${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
            IMAGE_CLIENT=${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}
            CLIENT_PORT=3000
            SERVER_PORT=3001
            ENVEOF

            # ── Pull latest compose file ─────────
            curl -fsSL \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml \
              -o docker-compose.prod.yml

            # ── Login to GHCR ────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull new images ──────────────────
            docker pull ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
            docker pull ${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}

            # ── Stage 2: Run DB migrations ───────
            # Migrations run BEFORE server starts — pipeline fails if this fails
            echo "Running TypeORM migrations..."
            docker run --rm \
              --env-file .env \
              -e DB_HOST=${{ secrets.STAGING_HOST }} \
              ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }} \
              node -e "
                const { DataSource } = require('typeorm');
                const ds = new DataSource({
                  type: 'postgres',
                  host: process.env.DB_HOST,
                  port: 5432,
                  username: process.env.POSTGRES_USER,
                  password: process.env.POSTGRES_PASSWORD,
                  database: process.env.POSTGRES_DB,
                  entities: ['dist/**/*.entity.js'],
                  migrations: ['dist/migrations/*.js'],
                  synchronize: false,
                });
                ds.initialize()
                  .then(() => ds.runMigrations({ transaction: 'all' }))
                  .then((ran) => {
                    console.log('Migrations run:', ran.length);
                    return ds.destroy();
                  })
                  .then(() => process.exit(0))
                  .catch(e => { console.error('Migration failed:', e.message); process.exit(1); });
              "
            echo "✅ Migrations completed"

            # ── Deploy ───────────────────────────
            docker compose -f docker-compose.prod.yml --env-file .env \
              up -d --remove-orphans --pull never

            sleep 20

      - name: Health check — staging
        run: |
          echo "Checking staging health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${{ secrets.STAGING_API_URL }}/products || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Staging is healthy (HTTP $STATUS)"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Staging health check failed after 10 attempts"
          exit 1

  deploy-production:
    name: Deploy to Production (Blue-Green)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - name: Deploy to production via SSH (Blue-Green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          port:     22
          script: |
            set -e
            mkdir -p ~/moderno-production
            cd ~/moderno-production

            # ── Determine active color ───────────
            # Blue = ports 3000/3001  |  Green = ports 3010/3011
            CURRENT=$(cat .active_color 2>/dev/null || echo "blue")
            if [ "$CURRENT" = "blue" ]; then
              NEW="green"; NEW_CLIENT_PORT=3010; NEW_SERVER_PORT=3011
              OLD_CLIENT_PORT=3000; OLD_SERVER_PORT=3001
            else
              NEW="blue";  NEW_CLIENT_PORT=3000; NEW_SERVER_PORT=3001
              OLD_CLIENT_PORT=3010; OLD_SERVER_PORT=3011
            fi
            echo "🔵🟢 Current: $CURRENT → Deploying: $NEW"

            # ── Write .env for new stack ─────────
            cat > .env.$NEW << 'ENVEOF'
            NODE_ENV=production
            POSTGRES_USER=${{ secrets.PROD_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
            FRONTEND_URL=${{ secrets.PROD_URL }}
            IMAGE_SERVER=${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
            IMAGE_CLIENT=${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}
            ENVEOF

            # Add dynamic ports to env
            echo "CLIENT_PORT=$NEW_CLIENT_PORT" >> .env.$NEW
            echo "SERVER_PORT=$NEW_SERVER_PORT" >> .env.$NEW

            # ── Pull latest compose file ─────────
            curl -fsSL \
              https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml \
              -o docker-compose.prod.yml

            # ── Login to GHCR ────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull new images ──────────────────
            docker pull ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
            docker pull ${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}

            # ── Stage 2: Run DB migrations ───────
            echo "Running TypeORM migrations..."
            docker run --rm \
              --env-file .env.$NEW \
              -e DB_HOST=${{ secrets.PROD_HOST }} \
              ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }} \
              node -e "
                const { DataSource } = require('typeorm');
                const ds = new DataSource({
                  type: 'postgres',
                  host: process.env.DB_HOST,
                  port: 5432,
                  username: process.env.POSTGRES_USER,
                  password: process.env.POSTGRES_PASSWORD,
                  database: process.env.POSTGRES_DB,
                  entities: ['dist/**/*.entity.js'],
                  migrations: ['dist/migrations/*.js'],
                  synchronize: false,
                });
                ds.initialize()
                  .then(() => ds.runMigrations({ transaction: 'all' }))
                  .then((ran) => {
                    console.log('Migrations run:', ran.length);
                    return ds.destroy();
                  })
                  .then(() => process.exit(0))
                  .catch(e => { console.error('Migration failed:', e.message); process.exit(1); });
              "
            echo "✅ Migrations completed"

            # ── Start NEW color stack ────────────
            echo "Starting $NEW stack on ports $NEW_CLIENT_PORT/$NEW_SERVER_PORT..."
            docker compose -f docker-compose.prod.yml --env-file .env.$NEW \
              -p moderno-$NEW up -d --remove-orphans --pull never

            # ── Health check new stack ───────────
            echo "Waiting for $NEW stack to be ready..."
            sleep 30
            HEALTHY=false
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:$NEW_SERVER_PORT/api/products || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
                echo "✅ $NEW stack is healthy"
                HEALTHY=true
                break
              fi
              sleep 10
            done

            # ── Rollback if unhealthy ────────────
            if [ "$HEALTHY" = "false" ]; then
              echo "❌ $NEW stack failed — rolling back"
              docker compose -f docker-compose.prod.yml \
                -p moderno-$NEW down --remove-orphans || true
              exit 1
            fi

            # ── Switch Nginx to new stack ────────
            if [ -f /etc/nginx/sites-available/moderno ]; then
              sudo sed -i \
                "s/localhost:$OLD_CLIENT_PORT/localhost:$NEW_CLIENT_PORT/g" \
                /etc/nginx/sites-available/moderno
              sudo sed -i \
                "s/localhost:$OLD_SERVER_PORT/localhost:$NEW_SERVER_PORT/g" \
                /etc/nginx/sites-available/moderno
              sudo nginx -t && sudo systemctl reload nginx
              echo "✅ Nginx switched to $NEW ($NEW_CLIENT_PORT/$NEW_SERVER_PORT)"
            fi

            # ── Tear down OLD stack ──────────────
            echo "Stopping $CURRENT stack..."
            docker compose -f docker-compose.prod.yml \
              -p moderno-$CURRENT down --remove-orphans || true

            # ── Persist state ────────────────────
            echo "$NEW" > .active_color
            cp .env.$NEW .env
            echo "✅ Blue-Green complete: $CURRENT → $NEW"

      - name: Health check — production
        run: |
          echo "Checking production health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${{ secrets.PROD_API_URL }}/products || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Production is healthy (HTTP $STATUS)"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Commit:      ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Image tag:   ${{ needs.build.outputs.image_tag }}"
