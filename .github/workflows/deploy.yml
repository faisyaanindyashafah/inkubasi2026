name: CD — Moderno Deploy

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/moderno

jobs:

  build:
    name: Build & push Docker images
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          TAG=${{ github.ref_name }}-${{ github.sha }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Resolve API URL for build
        id: api_url
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ secrets.STAGING_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-server:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-server:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-client:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-client:${{ github.ref_name }}-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: self-hosted
    if: github.ref_name == 'develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write staging .env
        run: |
          mkdir -p ~/moderno-staging
          cat > ~/moderno-staging/.env << 'ENVEOF'
          NODE_ENV=production
          POSTGRES_USER=${{ secrets.STAGING_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.STAGING_DB_NAME }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
          FRONTEND_URL=${{ secrets.STAGING_URL }}
          IMAGE_SERVER=${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
          IMAGE_CLIENT=${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}
          CLIENT_PORT=3000
          SERVER_PORT=3001
          ENVEOF

      - name: Copy compose file
        run: |
          cp $GITHUB_WORKSPACE/docker-compose.prod.yml ~/moderno-staging/docker-compose.prod.yml

      - name: Pull images from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
          docker pull ${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}

      - name: Run DB migrations
        run: |
          echo "Running TypeORM migrations..."
          docker run --rm \
            --env-file ~/moderno-staging/.env \
            --network host \
            -e DB_HOST=localhost \
            ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }} \
            node -e "
              const { DataSource } = require('typeorm');
              const ds = new DataSource({
                type: 'postgres',
                host: process.env.DB_HOST,
                port: 5432,
                username: process.env.POSTGRES_USER,
                password: process.env.POSTGRES_PASSWORD,
                database: process.env.POSTGRES_DB,
                entities: ['dist/**/*.entity.js'],
                migrations: ['dist/migrations/*.js'],
                synchronize: false,
              });
              ds.initialize()
                .then(() => ds.runMigrations({ transaction: 'all' }))
                .then((ran) => {
                  console.log('Migrations run:', ran.length);
                  return ds.destroy();
                })
                .then(() => process.exit(0))
                .catch(e => { console.error('Migration failed:', e.message); process.exit(1); });
            "
          echo "✅ Migrations completed"

      - name: Deploy staging stack
        run: |
          cd ~/moderno-staging
          docker compose -f docker-compose.prod.yml --env-file .env \
            up -d --remove-orphans --pull never
          echo "Waiting for services to stabilise..."
          sleep 20

      - name: Health check — staging
        run: |
          echo "Checking staging health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3001/api/products || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Staging is healthy (HTTP $STATUS)"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy to Production (Blue-Green)
    needs: build
    runs-on: self-hosted
    if: github.ref_name == 'main'
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Determine Blue-Green color
        id: color
        run: |
          mkdir -p ~/moderno-production
          CURRENT=$(cat ~/moderno-production/.active_color 2>/dev/null || echo "blue")
          if [ "$CURRENT" = "blue" ]; then
            NEW="green"; NEW_CLIENT_PORT=3010; NEW_SERVER_PORT=3011
            OLD_CLIENT_PORT=3000; OLD_SERVER_PORT=3001
          else
            NEW="blue";  NEW_CLIENT_PORT=3000; NEW_SERVER_PORT=3001
            OLD_CLIENT_PORT=3010; OLD_SERVER_PORT=3011
          fi
          echo "current=$CURRENT"         >> $GITHUB_OUTPUT
          echo "new=$NEW"                 >> $GITHUB_OUTPUT
          echo "new_client=$NEW_CLIENT_PORT" >> $GITHUB_OUTPUT
          echo "new_server=$NEW_SERVER_PORT" >> $GITHUB_OUTPUT
          echo "old_client=$OLD_CLIENT_PORT" >> $GITHUB_OUTPUT
          echo "old_server=$OLD_SERVER_PORT" >> $GITHUB_OUTPUT
          echo "🔵🟢 Current: $CURRENT → Deploying: $NEW"


      - name: Write production .env
        run: |
          cat > ~/moderno-production/.env.${{ steps.color.outputs.new }} << 'ENVEOF'
          NODE_ENV=production
          POSTGRES_USER=${{ secrets.PROD_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
          FRONTEND_URL=${{ secrets.PROD_URL }}
          IMAGE_SERVER=${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
          IMAGE_CLIENT=${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}
          ENVEOF
          echo "CLIENT_PORT=${{ steps.color.outputs.new_client }}" \
            >> ~/moderno-production/.env.${{ steps.color.outputs.new }}
          echo "SERVER_PORT=${{ steps.color.outputs.new_server }}" \
            >> ~/moderno-production/.env.${{ steps.color.outputs.new }}

      - name: Copy compose file
        run: |
          cp $GITHUB_WORKSPACE/docker-compose.prod.yml \
            ~/moderno-production/docker-compose.prod.yml

      - name: Pull images from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }}
          docker pull ${{ env.IMAGE_PREFIX }}-client:${{ needs.build.outputs.image_tag }}

      - name: Run DB migrations
        run: |
          echo "Running TypeORM migrations..."
          docker run --rm \
            --env-file ~/moderno-production/.env.${{ steps.color.outputs.new }} \
            --network host \
            -e DB_HOST=localhost \
            ${{ env.IMAGE_PREFIX }}-server:${{ needs.build.outputs.image_tag }} \
            node -e "
              const { DataSource } = require('typeorm');
              const ds = new DataSource({
                type: 'postgres',
                host: process.env.DB_HOST,
                port: 5432,
                username: process.env.POSTGRES_USER,
                password: process.env.POSTGRES_PASSWORD,
                database: process.env.POSTGRES_DB,
                entities: ['dist/**/*.entity.js'],
                migrations: ['dist/migrations/*.js'],
                synchronize: false,
              });
              ds.initialize()
                .then(() => ds.runMigrations({ transaction: 'all' }))
                .then((ran) => {
                  console.log('Migrations run:', ran.length);
                  return ds.destroy();
                })
                .then(() => process.exit(0))
                .catch(e => { console.error('Migration failed:', e.message); process.exit(1); });
            "
          echo "✅ Migrations completed"

      - name: Start new color stack
        run: |
          cd ~/moderno-production
          NEW=${{ steps.color.outputs.new }}
          docker compose -f docker-compose.prod.yml \
            --env-file .env.$NEW \
            -p moderno-$NEW \
            up -d --remove-orphans --pull never
          echo "Waiting for $NEW stack to be ready..."
          sleep 30

      - name: Health check new stack
        run: |
          NEW=${{ steps.color.outputs.new }}
          NEW_SERVER=${{ steps.color.outputs.new_server }}
          echo "Health checking $NEW stack on port $NEW_SERVER..."
          HEALTHY=false
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:$NEW_SERVER/api/products || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ $NEW stack is healthy"
              HEALTHY=true
              break
            fi
            sleep 10
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "❌ $NEW stack failed — rolling back"
            docker compose -f ~/moderno-production/docker-compose.prod.yml \
              -p moderno-$NEW down --remove-orphans || true
            exit 1
          fi

      - name: Switch Nginx to new stack
        run: |
          OLD_CLIENT=${{ steps.color.outputs.old_client }}
          NEW_CLIENT=${{ steps.color.outputs.new_client }}
          OLD_SERVER=${{ steps.color.outputs.old_server }}
          NEW_SERVER=${{ steps.color.outputs.new_server }}
          if [ -f /etc/nginx/sites-available/moderno ]; then
            sudo sed -i "s/localhost:$OLD_CLIENT/localhost:$NEW_CLIENT/g" \
              /etc/nginx/sites-available/moderno
            sudo sed -i "s/localhost:$OLD_SERVER/localhost:$NEW_SERVER/g" \
              /etc/nginx/sites-available/moderno
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Nginx switched → client:$NEW_CLIENT server:$NEW_SERVER"
          else
            echo "⚠️ Nginx config not found — skipping switch"
          fi

      - name: Tear down old stack
        run: |
          CURRENT=${{ steps.color.outputs.current }}
          echo "Stopping $CURRENT stack..."
          docker compose \
            -f ~/moderno-production/docker-compose.prod.yml \
            -p moderno-$CURRENT down --remove-orphans || true

      - name: Save active color
        run: |
          NEW=${{ steps.color.outputs.new }}
          echo "$NEW" > ~/moderno-production/.active_color
          cp ~/moderno-production/.env.$NEW ~/moderno-production/.env
          echo "✅ Blue-Green complete: ${{ steps.color.outputs.current }} → $NEW"

      - name: Health check — production public URL
        run: |
          echo "Checking production health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${{ secrets.PROD_API_URL }}/products || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Production is healthy (HTTP $STATUS)"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Commit:      ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Image tag:   ${{ needs.build.outputs.image_tag }}"
          echo "Active color: ${{ steps.color.outputs.new }}"
