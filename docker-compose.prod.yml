networks:
  moderno-network:
    driver: bridge

volumes:
  postgres_data_prod:

services:

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - moderno-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  server:
    image: ${IMAGE_SERVER:-ghcr.io/changeme/moderno-server:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3001
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_USERNAME:    ${POSTGRES_USER}
      DB_PASSWORD:    ${POSTGRES_PASSWORD}
      DB_NAME:        ${POSTGRES_DB}
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL:   ${FRONTEND_URL}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    networks:
      - moderno-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/products', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  client:
    image: ${IMAGE_CLIENT:-ghcr.io/changeme/moderno-client:latest}
    restart: always
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV:                production
      NEXT_PUBLIC_API_URL:     ${NEXT_PUBLIC_API_URL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      - moderno-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
